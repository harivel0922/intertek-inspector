<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTERTEK INSPECTOR</title>
<style>
:root{
  --navy:#08233f;--navy2:#0d355b;--teal:#18a6a8;--bg:#f4f7fa;
  --card:#fff;--text:#172333;--muted:#718096;--line:#e5eaf0;
  --danger:#d64545;--green:#159a68
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login{min-height:100vh;display:grid;place-items:center;padding:28px 18px;
background:linear-gradient(135deg,#061b31 0%,#083e67 48%,#0b79a0 100%);
position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;left:-8%;width:116%;height:190px;
border-radius:50%;pointer-events:none}
.login:before{bottom:-125px;background:rgba(8,54,91,.78);transform:rotate(-5deg)}
.login:after{bottom:-165px;background:rgba(12,104,139,.65);transform:rotate(7deg)}
.login-card{position:relative;z-index:1;width:min(650px,94vw);background:#fff;
border-radius:28px;padding:42px 58px 48px;box-shadow:0 28px 80px rgba(0,0,0,.32)}
.login-logo{display:flex;justify-content:center;align-items:center;height:145px;margin-bottom:5px}
.login-logo img{display:block;width:min(300px,70vw);max-height:140px;object-fit:contain}
.intertek-mark{font-weight:900;font-size:40px;letter-spacing:2px;color:#0b416d}
.wave{height:4px;background:linear-gradient(90deg,#1684bb,#19b8aa);margin:4px 0 28px;border-radius:5px}
.login-card h2{text-align:left;color:#143b5c;font-size:28px;margin:0 0 8px;font-weight:800}
.login-card>p{font-size:16px;margin:0 0 24px;color:#526b82}
.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#526b82}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:9px;outline:none;background:#fff}
.password-wrap{position:relative}.password-wrap input{padding-right:75px}
.password-wrap button{position:absolute;right:7px;top:7px;border:0;background:#edf3f7;border-radius:7px;padding:7px 9px;font-size:12px}
.login-btn{width:100%;height:54px;border:0;border-radius:12px;background:#082f51;color:#fff;
font-size:18px;font-weight:800;margin-top:10px}.login-btn:hover{background:#0b416d}
.login-note{text-align:center;font-size:12px;color:#8a98a8;margin-top:16px}

/* APP */
.layout{display:flex;min-height:100vh}.side{width:245px;background:var(--navy);color:#d9e7f3;
padding:20px 14px;position:fixed;inset:0 auto 0 0;height:100vh;overflow-y:auto}
.brand{padding:8px 12px 22px;color:white;font-weight:900;font-size:22px}
.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:#83cbd0;margin-top:4px}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#cfe0ee;
text-align:left;padding:12px 13px;border-radius:9px}.nav button:hover,.nav button.active{background:#16476d;color:#fff}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin:0}.user{font-size:13px;color:var(--muted)}
.content{padding:26px}.hero{background:linear-gradient(110deg,#0b3559,#087f8b);color:#fff;
border-radius:16px;padding:26px;margin-bottom:22px;min-height:150px;display:flex;justify-content:space-between;align-items:end}
.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#d6eef1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);padding:18px;border-radius:13px;border:1px solid var(--line)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .num{font-size:23px;font-weight:900;margin-top:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.card h3{margin:0;font-size:16px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:11px 16px;background:var(--teal);color:#fff;font-weight:700}
.btn.secondary{background:#eaf1f6;color:var(--navy)}.btn.danger{background:var(--danger)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:15px}
.toolbar input{max-width:330px;padding:10px;border:1px solid #d8e0e8;border-radius:9px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf2f7;font-size:11px;font-weight:700}
.status.open{background:#e8f5ff;color:#12649b}.status.complete{background:#e4f7ee;color:#087b50}
.empty{padding:35px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:#102a43;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 8px 30px #0003;z-index:20}
.footer{font-size:11px;color:#8a98a8;margin-top:20px}

@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){
.side{width:112px;padding:8px 6px}.brand{font-size:15px;padding:6px 2px;overflow:hidden}
.brand small{display:none}.nav button{padding:10px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{margin-left:112px;width:calc(100% - 112px)}.content{padding:10px}.top{padding:0 10px;height:64px}.top h1{font-size:17px}.user{display:none}
.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.formgrid{grid-template-columns:1fr}.hero{min-height:130px;padding:18px}.hero h2{font-size:21px}
.card{padding:12px}.table-wrap{overflow-x:auto}.table{min-width:700px}.login-card{padding:30px 22px 35px}
}
</style>
</head>

    <h2>INTERTEK INSPECTOR</h2>
    <p>Marine Survey Inspection Management System</p>

    <div class="field">
      <label>Intertek Email</label>
      <input id="loginUser" type="email" autocomplete="username" placeholder="name@intertek.com">
    </div>

    <div class="field">
      <label>Password</label>
      <div class="password-wrap">
        <input id="loginPass" type="password" autocomplete="current-password" placeholder="Enter password">
        <button type="button" onclick="togglePassword()">Show</button>
      </div>
    </div>

    <button type="button" class="login-btn" id="signInBtn">Sign In</button>
    <div style="text-align:right;margin-top:12px">
      <button type="button" onclick="forgotPassword()"
        style="border:0;background:none;color:#0b6680;font-weight:700;font-size:13px;padding:4px 0">
        Forgot Password?
      </button>
    </div>
    <div class="login-note">INTERTEK INSPECTOR • Standalone Admin Login</div>
  </div>
</div>

<div id="app" class="layout hidden">
  <aside class="side">
    <div class="brand">INTERTEK<small>INSPECTOR</small></div>
    <div class="nav">
      <button class="active" onclick="showPage('dashboard',this)">📊 Dashboard</button>
      <button onclick="showPage('jobs',this)">📋 All Jobs</button>
      <button onclick="showPage('create',this)">➕ Create Job</button>
      <button onclick="showPage('vessels',this)">🚢 Vessels</button>
      <button onclick="showPage('clients',this)">👥 Clients</button>
      <button onclick="showPage('documents',this)">📄 Documents</button>
      <button onclick="showPage('reports',this)">📑 Reports</button>
      <button onclick="showPage('admin',this)">🔐 Admin</button>
      <button onclick="showPage('settings',this)">⚙️ Settings</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="pageTitle">Dashboard</h1>
      <div><span class="user" id="userName">Operator</span>
      <button class="btn secondary" onclick="logout()">Logout</button></div>
    </header>
    <section id="content" class="content"></section>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<div id="buildVersion" style="display:none">INTERTEK INSPECTOR V4</div>

<script>
const STORAGE_KEY='intertek_survey_jobs_v1';
const SESSION_KEY='intertek_session_v1';
const ADMIN_USERS_KEY='intertek_admin_users_v1';
const DEFAULT_ADMIN={username:'admin',password:'Intertek@2026',role:'Admin',name:'Intertek Administrator'};

function getUsers(){
  try{const u=JSON.parse(localStorage.getItem(ADMIN_USERS_KEY)||'null'); if(Array.isArray(u)&&u.length)return u;}catch(e){}
  localStorage.setItem(ADMIN_USERS_KEY,JSON.stringify([DEFAULT_ADMIN]));
  return [DEFAULT_ADMIN];
}
function authenticateUser(username,password){
  return getUsers().find(u=>u.username===username && u.password===password) || null;
}

const jobStructure={
  'Bunkering':['Bunkering'],
  'Cargo':{
    'Chemical':['Discharge'],
    'UCO':['Loading']
  },
  'LPG':{
    'Discharge':['Pressurized LPG Mixture'],
    'Loading':['Pressurized LPG Mixture'],
    'Pipeline Transfer':['LPG'],
    'ITT':['LPG'],
    'Month-End Inventory':['LPG']
  }
};

function togglePassword(){
  const p=document.getElementById('loginPass');
  const b=p.parentElement.querySelector('button');
  p.type=p.type==='password'?'text':'password';
  b.textContent=p.type==='password'?'Show':'Hide';
}

function forgotPassword(){
  const u=document.getElementById('loginUser').value.trim();
  if(!u){
    toast('Enter your username / email first');
    document.getElementById('loginUser').focus();
    return;
  }
  alert('Password reset requested for: ' + u +
        '\\n\\nThe live email reset service will be connected when the Intertek authentication backend is added.');
}

function login(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(!u||!p){toast('Please enter username and password');return;}
  const account=authenticateUser(u,p);
  if(!account){toast('Invalid admin username or password');return;}
  localStorage.setItem(SESSION_KEY,JSON.stringify({user:account.username,name:account.name,role:account.role,loginAt:new Date().toISOString()}));
  startApp(account);
}

function logout(){
  localStorage.removeItem(SESSION_KEY);
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login').classList.remove('hidden');
  document.getElementById('loginPass').value='';
}

function startApp(user){
  const account=typeof user==='string'?{username:user,name:user,role:'Admin'}:user;
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('userName').textContent=(account.name||account.username)+' · '+(account.role||'Admin');
  showPage('dashboard',document.querySelector('.nav button'));
}

function getJobs(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]')}catch(e){return []}
}
function saveJobs(jobs){localStorage.setItem(STORAGE_KEY,JSON.stringify(jobs))}
function nextJobNo(){
  const y=new Date().getFullYear(), jobs=getJobs();
  let max=0;
  jobs.forEach(j=>{const m=String(j.jobNo||'').match(/ITK-(\d{4})-(\d+)/);if(m&&+m[1]===y)max=Math.max(max,+m[2])});
  return `ITK-${y}-${String(max+1).padStart(4,'0')}`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),2500);
}

function showPage(page,btn){
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  if(btn)btn.classList.add('active');
  const titles={dashboard:'Dashboard',jobs:'All Jobs',create:'Create New Job',vessels:'Vessels',clients:'Clients',documents:'Documents',reports:'Reports',admin:'Admin Control',settings:'Settings'};
  document.getElementById('pageTitle').textContent=titles[page]||'Dashboard';
  const c=document.getElementById('content');
  if(page==='dashboard')renderDashboard(c);
  else if(page==='jobs')renderJobs(c);
  else if(page==='create')renderCreate(c);
  else if(page==='admin')renderAdmin(c);
  else renderPlaceholder(c,titles[page]);
}

function renderDashboard(c){
  const jobs=getJobs(), open=jobs.filter(j=>j.status==='Open').length, done=jobs.filter(j=>j.status==='Completed').length;
  const today=new Date().toISOString().slice(0,10);
  c.innerHTML=`
    <div class="hero"><div><h2>Intertek Inspector</h2><p>Manage inspection and marine survey jobs from one place.</p></div>
    <button class="btn" onclick="showPage('create',document.querySelectorAll('.nav button')[2])">+ Create New Job</button></div>
    <div class="kpis">
      <div class="kpi"><div class="label">TOTAL JOBS</div><div class="num">${jobs.length}</div></div>
      <div class="kpi"><div class="label">OPEN JOBS</div><div class="num">${open}</div></div>
      <div class="kpi"><div class="label">COMPLETED</div><div class="num">${done}</div></div>
      <div class="kpi"><div class="label">TODAY</div><div class="num">${jobs.filter(j=>j.date===today).length}</div></div>
      <div class="kpi"><div class="label">CATEGORIES</div><div class="num">${new Set(jobs.map(j=>j.category)).size}</div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Locked Job Structure</h3></div>
<div style="display:grid;gap:7px;font-size:13px">
  <div><b>Bunkering</b> → Bunkering</div>
  <div><b>Cargo</b> → Chemical / UCO</div>
  <div><b>LPG</b> → Discharge / Loading / Pipeline Transfer / ITT / Month-End Inventory</div>
</div></div>
<div class="card"><div class="card-head"><h3>Recent Jobs</h3>
    <button class="btn secondary" onclick="showPage('jobs',document.querySelectorAll('.nav button')[1])">View All</button></div>
    ${jobTable(jobs.slice().reverse().slice(0,8))}</div>
    <div class="footer">Base V2 • Job framework ready for document modules and calculations.</div>`;
}

function jobTable(jobs){
  if(!jobs.length)return '<div class="empty">No jobs created yet.</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr>
  <th>Job No</th><th>Date</th><th>Client</th><th>Vessel</th><th>Category</th><th>Work Type</th><th>Operation</th><th>Status</th>
  </tr></thead><tbody>${jobs.map(j=>`<tr>
  <td><b>${esc(j.jobNo)}</b></td><td>${esc(j.date)}</td><td>${esc(j.client)}</td><td>${esc(j.vessel)}</td>
  <td>${esc(j.category)}</td><td>${esc(j.workType)}</td><td>${esc(j.operation)}</td><td><span class="status ${j.status==='Completed'?'complete':'open'}">${esc(j.status)}</span></td>
  </tr>`).join('')}</tbody></table></div>`;
}

function renderJobs(c){
  const jobs=getJobs();
  c.innerHTML=`<div class="card"><div class="toolbar"><h3>All Jobs</h3>
  <button class="btn" onclick="showPage('create',document.querySelectorAll('.nav button')[2])">+ Create Job</button></div>
  ${jobTable(jobs.slice().reverse())}</div>`;
}

function renderCreate(c){
  const jobNo=nextJobNo();
  const today=new Date().toISOString().slice(0,10);
  c.innerHTML=`<div class="card"><div class="card-head"><h3>New Survey Job</h3><span class="status open">V2 BASE</span></div>
  <div class="formgrid">
    <div class="field"><label>Job No</label><input id="jobNo" value="${jobNo}" readonly></div>
    <div class="field"><label>Date</label><input id="jobDate" type="date" value="${today}"></div>
    <div class="field"><label>Job Category</label>
      <select id="jobCategory" onchange="updateJobTypeFields()">
        <option value="">Select Category</option>
        <option>Bunkering</option><option>Cargo</option><option>LPG</option>
      </select>
    </div>
    <div class="field"><label>Work Type</label><select id="jobWorkType" onchange="updateJobTypeFields()" disabled><option>Select category first</option></select></div>
    <div class="field"><label>Operation / Product</label><select id="jobOperation" disabled><option>Select work type first</option></select></div>
    <div class="field"><label>Client</label><input id="jobClient" placeholder="Client name"></div>
    <div class="field"><label>Vessel</label><input id="jobVessel" placeholder="Vessel name"></div>
    <div class="field"><label>IMO No.</label><input id="jobIMO" placeholder="IMO number"></div>
    <div class="field"><label>Port / Terminal</label><input id="jobPort" placeholder="Port / terminal"></div>
    <div class="field"><label>Surveyor</label><input id="jobSurveyor" placeholder="Surveyor name"></div>
    <div class="field"><label>PO / Reference</label><input id="jobRef" placeholder="PO / client reference"></div>
  </div>
  <div class="field"><label>Remarks</label><textarea id="jobRemarks" rows="4" placeholder="Initial job remarks"></textarea></div>
  <div id="workflowPreview" class="card" style="background:#f7fafc;margin-top:12px">
    <b>Workflow</b><div class="empty" style="padding:18px">Select a Job Category to begin.</div>
  </div>
  <button class="btn" onclick="saveNewJob()">Save Job</button>
  <button class="btn secondary" onclick="showPage('dashboard',document.querySelector('.nav button'))">Cancel</button>
  </div>`;
}

function updateJobTypeFields(){
  const category=document.getElementById('jobCategory').value;
  const work=document.getElementById('jobWorkType');
  const op=document.getElementById('jobOperation');
  const preview=document.getElementById('workflowPreview');

  work.innerHTML='';
  op.innerHTML='';
  op.disabled=true;

  if(!category){
    work.disabled=true;
    work.innerHTML='<option>Select category first</option>';
    preview.innerHTML='<b>Workflow</b><div class="empty" style="padding:18px">Select a Job Category to begin.</div>';
    return;
  }

  work.disabled=false;
  let workTypes=[];
  if(category==='Bunkering') workTypes=['Bunkering'];
  if(category==='Cargo') workTypes=['Chemical','UCO'];
  if(category==='LPG') workTypes=['Discharge','Loading','Pipeline Transfer','ITT','Month-End Inventory'];

  work.innerHTML='<option value="">Select Work Type</option>'+workTypes.map(x=>`<option>${x}</option>`).join('');
  work.onchange=updateOperationOptions;

  if(category==='Bunkering'){
    work.value='Bunkering';
    work.disabled=true;
    op.disabled=false;
    op.innerHTML='<option>Bunkering</option>';
    renderWorkflowPreview(category,'Bunkering','Bunkering');
  }else{
    renderWorkflowPreview(category,'','');
  }
}

function updateOperationOptions(){
  const category=document.getElementById('jobCategory').value;
  const work=document.getElementById('jobWorkType').value;
  const op=document.getElementById('jobOperation');
  op.disabled=false;

  let options=[];
  if(category==='Cargo' && work==='Chemical') options=['Discharge – Chemical'];
  if(category==='Cargo' && work==='UCO') options=['Loading – UCO'];
  if(category==='LPG' && work==='Discharge') options=['Pressurized LPG Mixture'];
  if(category==='LPG' && work==='Loading') options=['Pressurized LPG Mixture'];
  if(category==='LPG' && work==='Pipeline Transfer') options=['LPG'];
  if(category==='LPG' && work==='ITT') options=['LPG'];
  if(category==='LPG' && work==='Month-End Inventory') options=['LPG'];

  op.innerHTML=options.length?options.map(x=>`<option>${x}</option>`).join():'<option>Select work type first</option>';
  renderWorkflowPreview(category,work,options[0]||'');
}

function renderWorkflowPreview(category,work,operation){
  const preview=document.getElementById('workflowPreview');
  if(!preview)return;
  let items=['Job Information'];
  if(category==='Bunkering') items.push('Bunkering details');
  if(category==='Cargo') items.push('Cargo details','Sampling','Quantity / measurement data','Required report documents');
  if(category==='LPG' && work==='Discharge') items.push('Vessel / shore details','Before discharge','After discharge','Quantity calculations','Sampling','Time Sheet','COQ / final documents');
  if(category==='LPG' && work==='Loading') items.push('Vessel / shore details','Before loading','After loading','Quantity calculations','Sampling','Time Sheet','COQ / final documents');
  if(category==='LPG' && work==='Pipeline Transfer') items.push('Source tank / line','Transfer timing','Receiving tank','Shore tank calculations','Quantity comparison','COQ','Time Sheet','NOD / final documents');
  if(category==='LPG' && work==='ITT') items.push('Source tank(s)','Receiving tank(s)','Before / after data','Quantity calculations','COQ','Final documents');
  if(category==='LPG' && work==='Month-End Inventory') items.push('Inventory date','Tank list','Opening / closing quantities','Quantity calculations','Inventory report');
  preview.innerHTML='<b>Workflow</b><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:10px">'+items.map(x=>`<span class="status">${esc(x)}</span>`).join('')+'</div>'+(category==='LPG'&&work==='Pipeline Transfer'?'<div style="margin-top:14px"><button type="button" class="btn" onclick="openPipelineTransferWorkflow()">Open Pipeline Transfer Workflow →</button></div>':'');
}


function pipelineNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function pipelinePct(diff,received){return received?((diff/received)*100):0}
function pipelineField(id,label,value='',type='text',step='any'){return `<div class="field"><label>${esc(label)}</label><input id="${id}" type="${type}" ${type==='number'?`step="${step}"`:''} value="${esc(value)}"></div>`}
function openPipelineTransferWorkflow(){
  const c=document.getElementById('content');
  const base={jobNo:document.getElementById('jobNo')?.value||nextJobNo(),date:document.getElementById('jobDate')?.value||new Date().toISOString().slice(0,10),client:document.getElementById('jobClient')?.value||'',vessel:document.getElementById('jobVessel')?.value||'',imo:document.getElementById('jobIMO')?.value||'',port:document.getElementById('jobPort')?.value||'',surveyor:document.getElementById('jobSurveyor')?.value||'',reference:document.getElementById('jobRef')?.value||''};
  c.innerHTML=`
  <div class="card"><div class="card-head"><div><h3>Pipeline Transfer — Automated Workflow</h3><div class="footer">Based on the supplied Inter Tank to Tank Transfer report/workbook structure.</div></div><span class="status open">LPG · PIPELINE TRANSFER</span></div>
  <div class="formgrid">
    ${pipelineField('ptJobNo','Job No.',base.jobNo)} ${pipelineField('ptDate','Report Date',base.date,'date')}
    ${pipelineField('ptJobId','Intertek Job ID','')} ${pipelineField('ptBl','Bill of Lading No.','')}
    ${pipelineField('ptCustomer','Customer / For and on behalf of','FOR AND ON BEHALF OF EQUINOR ASA')} ${pipelineField('ptCargo','Cargo','LPG')}
    ${pipelineField('ptSupplier','Terminal (Transferred)','')} ${pipelineField('ptReceiver','Terminal (Received)','')}
    ${pipelineField('ptSourceTanks','Source Tank(s)','')} ${pipelineField('ptReceivingTanks','Receiving Tank(s)','')}
    ${pipelineField('ptDates','Transfer Date(s)','')} ${pipelineField('ptSurveyor','Approved By',base.surveyor)}
  </div>
  <div class="card" style="background:#f7fafc;margin-top:12px"><h3>Quantity Comparison</h3>
    <div class="table-wrap"><table class="table"><thead><tr><th>Quantity</th><th>Received</th><th>Transferred</th><th>Difference</th><th>% Difference</th></tr></thead><tbody>
      ${['KL / Litres @ 15 °C','US Barrels @ 60 °F','Metric tons (in Vac)','Metric tons (in Air)','Long Tons'].map((x,i)=>`<tr><td><b>${x}</b></td><td><input class="pt-rec" data-i="${i}" type="number" step="0.001" oninput="calcPipelineTotals()"></td><td><input class="pt-trans" data-i="${i}" type="number" step="0.001" oninput="calcPipelineTotals()"></td><td><input class="pt-diff" data-i="${i}" readonly></td><td><input class="pt-pct" data-i="${i}" readonly></td></tr>`).join('')}
    </tbody></table></div>
    <div class="footer" style="margin-top:8px">Difference = Received − Transferred. Percentage = Difference ÷ Received × 100.</div>
  </div>
  <div class="card" style="background:#f7fafc;margin-top:12px"><h3>COQ / Measurement Data</h3><div class="formgrid">
    ${pipelineField('ptDensity','Density @ 15 °C','','number','0.0001')}${pipelineField('ptSourceTankRef','Shore Tank No. / Reference','')}
    ${pipelineField('ptQuantityBasis','Quantity Basis','Shore tank terminal figure')}${pipelineField('ptRemarks','Remarks','')}
  </div></div>
  <div class="card" style="background:#f7fafc;margin-top:12px"><h3>Time Sheet</h3><div class="table-wrap"><table class="table"><thead><tr><th>Event</th><th>Date</th><th>Time / Period</th></tr></thead><tbody>
    ${['Key Meeting','Initial Tank Inspection - Commenced / Completed','Before Transfer Sampling - Commenced / Completed','Commenced Transfer','Commenced / Completed Stenching','Completed Transfer','After Transfer Tank Inspection - Commenced / Completed','Calculation / Figures - Commenced / Completed','Final Sampling - Commenced / Completed','Document Completed'].map((x,i)=>`<tr><td>${x}</td><td><input class="pt-event-date" data-i="${i}" type="date"></td><td><input class="pt-event-time" data-i="${i}" placeholder="e.g. 2236-2248"></td></tr>`).join('')}
  </tbody></table></div></div>
  <div class="card" style="background:#f7fafc;margin-top:12px"><h3>NOD / Notice of Difference</h3><div class="formgrid">
    ${pipelineField('ptNodStatus','NOD Status','Auto calculated')}${pipelineField('ptNodMetric','NOD Metric','Metric tons (in Air)')}
    ${pipelineField('ptNodDifference','NOD Difference','', 'number','0.001')}${pipelineField('ptNodPercent','NOD %','', 'number','0.01')}
  </div><div class="footer">The NOD section is populated from the quantity comparison and can be reviewed before final issue.</div></div>
  <div class="actions" style="margin-top:14px"><button class="btn" onclick="savePipelineTransferJob()">Save Pipeline Transfer Job</button><button class="btn secondary" onclick="previewPipelineTransferReport()">Preview Report Package</button><button class="btn secondary" onclick="showPage('create',document.querySelectorAll('.nav button')[2])">Back</button></div>
  <div id="ptReportPreview" style="margin-top:14px"></div>
  </div>`;
  window._pipelineBase=base;
}
function calcPipelineTotals(){
  document.querySelectorAll('.pt-rec').forEach((el,i)=>{
    const rec=pipelineNum(el.value), trans=pipelineNum(document.querySelector(`.pt-trans[data-i="${i}"]`)?.value);
    const diff=rec-trans, pct=pipelinePct(diff,rec);
    const d=document.querySelector(`.pt-diff[data-i="${i}"]`),p=document.querySelector(`.pt-pct[data-i="${i}"]`);
    if(d)d.value=diff.toFixed(3); if(p)p.value=pct.toFixed(3)+'%';
  });
  const airDiff=pipelineNum(document.querySelector('.pt-diff[data-i="3"]')?.value), airPct=pipelineNum(String(document.querySelector('.pt-pct[data-i="3"]')?.value||'').replace('%',''));
  const nd=document.getElementById('ptNodDifference'),np=document.getElementById('ptNodPercent'); if(nd)nd.value=airDiff.toFixed(3); if(np)np.value=airPct.toFixed(3);
}
function collectPipelineData(){
  const rows=[...document.querySelectorAll('.pt-rec')].map((el,i)=>({metric:el.closest('tr').querySelector('td').innerText.trim(),received:pipelineNum(el.value),transferred:pipelineNum(document.querySelector(`.pt-trans[data-i="${i}"]`)?.value),difference:pipelineNum(document.querySelector(`.pt-diff[data-i="${i}"]`)?.value),percent:document.querySelector(`.pt-pct[data-i="${i}"]`)?.value||''}));
  const events=[...document.querySelectorAll('.pt-event-date')].map((el,i)=>({event:el.closest('tr').querySelector('td').innerText.trim(),date:el.value||'',time:document.querySelector(`.pt-event-time[data-i="${i}"]`)?.value||''}));
  return {jobId:document.getElementById('ptJobId')?.value||'',blNo:document.getElementById('ptBl')?.value||'',customer:document.getElementById('ptCustomer')?.value||'',cargo:document.getElementById('ptCargo')?.value||'LPG',supplier:document.getElementById('ptSupplier')?.value||'',receiver:document.getElementById('ptReceiver')?.value||'',sourceTanks:document.getElementById('ptSourceTanks')?.value||'',receivingTanks:document.getElementById('ptReceivingTanks')?.value||'',transferDates:document.getElementById('ptDates')?.value||'',density:pipelineNum(document.getElementById('ptDensity')?.value),sourceTankRef:document.getElementById('ptSourceTankRef')?.value||'',quantityBasis:document.getElementById('ptQuantityBasis')?.value||'',remarks:document.getElementById('ptRemarks')?.value||'',nodMetric:document.getElementById('ptNodMetric')?.value||'Metric tons (in Air)',nodDifference:pipelineNum(document.getElementById('ptNodDifference')?.value),nodPercent:pipelineNum(document.getElementById('ptNodPercent')?.value),rows,events};
}
function savePipelineTransferJob(){
  calcPipelineTotals(); const b=window._pipelineBase||{}; const d=collectPipelineData();
  const job={jobNo:b.jobNo,date:b.date,category:'LPG',workType:'Pipeline Transfer',operation:'LPG',client:d.customer||b.client||'',vessel:b.vessel||'',imo:b.imo||'',port:b.port||'',surveyor:document.getElementById('ptSurveyor')?.value||b.surveyor||'',reference:b.reference||'',remarks:d.remarks||'',status:'Open',createdAt:new Date().toISOString(),pipeline:d};
  if(!job.client||!d.supplier||!d.receiver||!d.sourceTanks||!d.receivingTanks){toast('Please complete customer, transferred terminal, received terminal and tank fields.');return;}
  const jobs=getJobs();jobs.push(job);saveJobs(jobs);toast('Pipeline Transfer job saved successfully');setTimeout(()=>showPage('jobs',document.querySelectorAll('.nav button')[1]),500);
}
function previewPipelineTransferReport(){
  calcPipelineTotals(); const b=window._pipelineBase||{}, d=collectPipelineData(); const r=d.rows;
  const air=r[3]||{}, status=Math.abs(Number(air.percent||'0'))>0.02?'Review difference':'Within current comparison';
  document.getElementById('ptReportPreview').innerHTML=`<div class="card" style="border:2px solid #17324d"><h3>Report Package Preview</h3><div class="formgrid"><div><b>Job No.</b><br>${esc(b.jobNo)}</div><div><b>Operation</b><br>TANK TO TANK TRANSFER & LPG</div><div><b>Transferred</b><br>${esc(d.supplier)}</div><div><b>Received</b><br>${esc(d.receiver)}</div><div><b>Tanks</b><br>${esc(d.sourceTanks)} TO ${esc(d.receivingTanks)}</div><div><b>Bill of Lading</b><br>${esc(d.blNo||'-')}</div></div><hr><b>Enclosures</b><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px"><span class="status">Certificate of Quantity</span><span class="status">Shore Tank Calculations</span><span class="status">Time Sheet</span><span class="status">Quantity Comparison</span><span class="status">NOD / Difference Notice</span></div><div style="margin-top:12px"><b>Metric tons (in Air)</b>: Received ${air.received.toFixed(3)} · Transferred ${air.transferred.toFixed(3)} · Difference ${air.difference.toFixed(3)} · ${air.percent}</div><div class="footer" style="margin-top:8px">Status: ${esc(status)}. Final report wording/layout will be matched to the supplied Intertek template in the next document-generation step.</div></div>`;
}

function saveNewJob(){
  const job={
    jobNo:document.getElementById('jobNo').value,
    date:document.getElementById('jobDate').value,
    category:document.getElementById('jobCategory').value,
    workType:document.getElementById('jobWorkType').value,
    operation:document.getElementById('jobOperation').value,
    client:document.getElementById('jobClient').value.trim(),
    vessel:document.getElementById('jobVessel').value.trim(),
    imo:document.getElementById('jobIMO').value.trim(),
    port:document.getElementById('jobPort').value.trim(),
    surveyor:document.getElementById('jobSurveyor').value.trim(),
    reference:document.getElementById('jobRef').value.trim(),
    remarks:document.getElementById('jobRemarks').value.trim(),
    status:'Open',
    createdAt:new Date().toISOString()
  };
  if(!job.category||!job.workType||!job.operation){toast('Please select the Job Category and Work Type');return;}
  if(!job.client||!job.vessel){toast('Please enter at least Client and Vessel');return;}
  const jobs=getJobs();jobs.push(job);saveJobs(jobs);
  toast('Job saved successfully');
  setTimeout(()=>showPage('jobs',document.querySelectorAll('.nav button')[1]),500);
}

document.addEventListener('DOMContentLoaded',()=>{
  const signIn=document.getElementById('signInBtn');
  const user=document.getElementById('loginUser');
  const pass=document.getElementById('loginPass');
  if(signIn) signIn.addEventListener('click',login);
  if(user) user.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();pass?.focus();}});
  if(pass) pass.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login();}});
});
const session=localStorage.getItem(SESSION_KEY);
if(session){try{startApp(JSON.parse(session).user)}catch(e){logout()}}
</script>
