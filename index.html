<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTERTEK INSPECTOR</title>
<style>
:root{
  --navy:#111111;--navy2:#1d1d1d;--teal:#f5c400;--yellow:#f5c400;--bg:#f5f6f7;
  --card:#fff;--text:#172333;--muted:#718096;--line:#e5eaf0;
  --danger:#d64545;--green:#159a68
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
.login{min-height:100vh;display:grid;place-items:center;padding:28px 18px;
background:linear-gradient(135deg,#090909 0%,#171717 58%,#2a2a2a 100%);
position:relative;overflow:hidden}
.login:before,.login:after{content:"";position:absolute;left:-8%;width:116%;height:190px;
border-radius:50%;pointer-events:none}
.login:before{bottom:-125px;background:rgba(245,196,0,.20);transform:rotate(-5deg)}
.login:after{bottom:-165px;background:rgba(245,196,0,.12);transform:rotate(7deg)}
.login-card{position:relative;z-index:1;width:min(650px,94vw);background:#fff;
border-radius:28px;padding:42px 58px 48px;box-shadow:0 28px 80px rgba(0,0,0,.32)}
.login-logo{display:flex;justify-content:center;align-items:center;height:145px;margin-bottom:5px}
.login-logo img{display:block;width:min(300px,70vw);max-height:140px;object-fit:contain}
.intertek-mark{font-weight:900;font-size:40px;letter-spacing:2px;color:#111}
.wave{height:4px;background:linear-gradient(90deg,#111,#f5c400);margin:4px 0 28px;border-radius:5px}
.login-card h2{text-align:left;color:#111;font-size:28px;margin:0 0 8px;font-weight:800}
.login-card>p{font-size:16px;margin:0 0 24px;color:#526b82}
.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#526b82}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d8e0e8;border-radius:9px;outline:none;background:#fff}
.password-wrap{position:relative}.password-wrap input{padding-right:75px}
.password-wrap button{position:absolute;right:7px;top:7px;border:0;background:#edf3f7;border-radius:7px;padding:7px 9px;font-size:12px}
.login-btn{width:100%;height:54px;border:0;border-radius:12px;background:#111;color:#fff;
font-size:18px;font-weight:800;margin-top:10px}.login-btn:hover{background:#000;box-shadow:0 0 0 3px rgba(245,196,0,.35)}
.login-note{text-align:center;font-size:12px;color:#8a98a8;margin-top:16px}

/* APP */
.layout{display:flex;min-height:100vh}.side{width:245px;background:#111;color:#f1f1f1;
padding:20px 14px;position:fixed;inset:0 auto 0 0;height:100vh;overflow-y:auto}
.brand{padding:8px 12px 22px;color:white;font-weight:900;font-size:22px}
.brand small{display:block;font-size:10px;letter-spacing:1.2px;color:#f5c400;margin-top:4px}
.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#eeeeee;
text-align:left;padding:12px 13px;border-radius:9px}.nav button:hover,.nav button.active{background:#f5c400;color:#111;font-weight:800}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);
display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}
.top h1{font-size:20px;margin:0}.user{font-size:13px;color:var(--muted)}
.content{padding:26px}.hero{background:linear-gradient(110deg,#111,#242424);color:#fff;border-left:6px solid #f5c400;
border-radius:16px;padding:26px;margin-bottom:22px;min-height:150px;display:flex;justify-content:space-between;align-items:end}
.hero h2{margin:0 0 6px;font-size:28px}.hero p{margin:0;color:#f1f1f1}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--card);padding:18px;border-radius:13px;border:1px solid var(--line)}
.kpi .label{font-size:12px;color:var(--muted);font-weight:700}.kpi .num{font-size:23px;font-weight:900;margin-top:7px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:18px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.card h3{margin:0;font-size:16px}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.btn{border:0;border-radius:9px;padding:11px 16px;background:#f5c400;color:#111;font-weight:800}
.btn.secondary{background:#eeeeee;color:#111}.btn.danger{background:var(--danger)}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:15px}
.toolbar input{max-width:330px;padding:10px;border:1px solid #d8e0e8;border-radius:9px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
.table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.status{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf2f7;font-size:11px;font-weight:700}
.status.open{background:#fff3b8;color:#6a5200}.status.complete{background:#e4f7ee;color:#087b50}
.empty{padding:35px;text-align:center;color:var(--muted)}
.toast{position:fixed;right:22px;bottom:22px;background:#111;color:#fff;padding:13px 18px;border-radius:10px;box-shadow:0 8px 30px #0003;z-index:20}
.footer{font-size:11px;color:#8a98a8;margin-top:20px}

@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){
.side{width:112px;padding:8px 6px}.brand{font-size:15px;padding:6px 2px;overflow:hidden}
.brand small{display:none}.nav button{padding:10px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{margin-left:112px;width:calc(100% - 112px)}.content{padding:10px}.top{padding:0 10px;height:64px}.top h1{font-size:17px}.user{display:none}
.kpis{grid-template-columns:repeat(2,1fr);gap:8px}.formgrid{grid-template-columns:1fr}.hero{min-height:130px;padding:18px}.hero h2{font-size:21px}
.card{padding:12px}.table-wrap{overflow-x:auto}.table{min-width:700px}.login-card{padding:30px 22px 35px}
}

/* V6 WORKFLOW */
.workflow-steps{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.step{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:12px;font-weight:800}.step.done{background:#111;color:#fff;border-color:#111}.step.current{background:#f5c400;color:#111;border-color:#f5c400}.subcard{background:#fafafa;border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}.notice{background:#fff8d6;border-left:4px solid #f5c400;padding:12px;border-radius:8px}.danger-note{background:#fff1f1;border-left:4px solid #d64545;padding:12px;border-radius:8px}.mini{font-size:11px;color:var(--muted)}

</style>

h2,h3,h4{color:#171717 !important}
.btn{

  border:0 !important;

}
.btn:hover{background:#ffd21a !important}
.btn.secondary{
  background:#111 !important;
  color:#fff !important;
}
input,select,textarea{
  background:#fff !important;
  border:1px solid #cfcfcf !important;
  color:#111 !important;
}
input:focus,select:focus,textarea:focus{

  box-shadow:0 0 0 3px rgba(245,196,0,.22) !important;
}
.status.open{

}
.status.completed{
  background:#111 !important;
  color:#fff !important;
}
.login{
  background:linear-gradient(135deg,#111 0%,#222 62%,#f5c400 100%) !important;
}
.login-card{
  border-top:7px solid #f5c400 !important;
}
.login-btn{
  background:#111 !important;
  color:#fff !important;
  border:3px solid #f5c400 !important;
}
.login-btn:hover{
  background:#f5c400 !important;
  color:#111 !important;
}
.wave{background:linear-gradient(90deg,#111 0%,#f5c400 100%) !important}
a{color:#8a6a00}
.toast{background:#111 !important;border-left:5px solid #f5c400 !important}
.table th{background:#111 !important;color:#fff !important}
.table tr:hover td{background:#fff9d9 !important}
</style>
